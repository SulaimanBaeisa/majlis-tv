name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tests/check_daily_sources.py pins commit 11bd97c
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Java tests
        run: bash tests/run.sh
      - name: Religious sources
        run: python3 tests/check_daily_sources.py
      - name: Brand strings
        run: bash tests/check_brand.sh
      - name: Installer unit tests
        run: python3 -m unittest discover -s tests/tools -v
      - name: Python syntax
        run: python3 -m py_compile tooling/tv.py tooling/release_guard.py tests/tools/*.py

  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the runner's newest build-tools
        run: echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Frozen permissions and hosts
        env:
          MASH_UNSIGNED: "1"
        run: bash tests/check_surface.sh
